services:
  mysql:
    image: mysql:8.0
    container_name: gencode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: gencode
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=1
    volumes:
      - gencode-mysql-data:/var/lib/mysql
      - ./sql/gencode-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gencode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gencode-redis-data:/data

volumes:
  gencode-mysql-data:
  gencode-redis-data:
